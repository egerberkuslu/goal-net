# coturn — TURN relay for Goal Net.
# Hard requirements from brain/20-tech-spec/netcode-p2p.md live in this file.
# Anything host- or secret-specific is injected as a CLI flag by entrypoint.sh
# so nothing sensitive is ever committed: realm, static-auth-secret,
# listening-ip, relay-ip and external-ip all arrive from the environment.

# --- listeners --------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# --- authentication ---------------------------------------------------------
# TURN REST API: the web server derives username=(unix_ts+ttl):userId and
# credential=base64(HMAC-SHA1(secret, username)). coturn recomputes the same
# HMAC from static-auth-secret, so no user database is needed and the
# credential expires by itself.
# NEVER enable no-auth here: an open relay is abused within hours.
use-auth-secret
# realm=<injected>              --realm from TURN_REALM
# static-auth-secret=<injected> --static-auth-secret from TURN_SECRET
stale-nonce=600

# --- relay port range -------------------------------------------------------
# Must match the UDP range opened on the firewall. network_mode: host is used
# in compose precisely because publishing this range through Docker's NAT is
# unreliable for relay traffic.
min-port=49152
max-port=65535

# --- abuse limits -----------------------------------------------------------
# total-quota caps concurrent allocations server wide; user-quota caps one
# credential. Tune upward once you know your real concurrency.
total-quota=100
user-quota=12
# Bandwidth ceiling per allocation, bytes/s. 0 disables.
max-bps=0

# --- what peers may be relayed to -------------------------------------------
# Without these a relay can be pointed at loopback or link-local services and
# used to reach things behind the server's own firewall.
#
# The spec asks for no-loopback-peers. coturn dropped that keyword in 4.5.1.1:
# loopback peers are denied by default now and only --allow-loopback-peers can
# re-enable them. Leaving the old keyword in makes coturn log "Bad
# configuration format" on every start, so the rule is written out explicitly
# instead. Same effect, no warning, and it survives a future default flip.
no-multicast-peers
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=::1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=224.0.0.0-255.255.255.255

# --- TLS --------------------------------------------------------------------
# Paths are fixed inside the container; mount real certificates over them.
# Production: Let's Encrypt fullchain.pem / privkey.pem for the TURN hostname.
# Local dev: docker/coturn/gen-dev-cert.sh writes a self-signed pair into
#            docker/coturn/certs/ (gitignored). entrypoint.sh falls back to
#            --no-tls --no-dtls, loudly, when neither file is present.
cert=/etc/coturn/certs/turn_server_cert.pem
pkey=/etc/coturn/certs/turn_server_pkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:!aNULL:!MD5:!DSS"

# --- hardening / logging ----------------------------------------------------
fingerprint
no-cli
no-software-attribute
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
log-file=stdout
simple-log
